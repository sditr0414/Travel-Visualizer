name: patch-zoom-context

on:
  push:
    branches: [ai/fix-map-zoom-application]

permissions:
  contents: write

jobs:
  patch-context:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ai/fix-map-zoom-application
      - name: Patch zoom contract documentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('AI_PROJECT_CONTEXT.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "Worker 요청은 `SCAN_TIMELINE`, `PLAN_TRIP`, `CANCEL`을 사용합니다. 플레이어의 핵심 제어는 `loadPlan`, `play`, `pause`, `seek`, `reset`, `dispose`이며 설정 동기화를 위한 `setStops`, `setLockToPosition`, `setTrackingSpeed`, `setZoomOffset`이 있습니다. `setStops`는 사진 또는 날짜 marker stop 추가·제거·길이 변경 시 현재 경로 진행 위치를 보존하고, 같은 stop의 길이만 바뀌면 해당 stop 내부의 진행 비율도 보존합니다. `setZoomOffset`은 현재 계획의 `plan.zoomOffset`과 사용자 현재 설정의 차이만 live camera에 적용해 재계획 전후에 확대가 중복되지 않게 하며, 변경 즉시 현재 프레임을 다시 그립니다. `DurationLimits`는 `minSeconds/recommendedSeconds/maxSeconds` 외에 계산 근거인 `days`, `activeDays`, `distanceKm`, `extentKm`, `movementCount`를 보관합니다.",
              "Worker 요청은 `SCAN_TIMELINE`, `PLAN_TRIP`, `CANCEL`을 사용합니다. 플레이어의 핵심 제어는 `loadPlan`, `play`, `pause`, `seek`, `reset`, `dispose`이며 설정 동기화를 위한 `setStops`, `setLockToPosition`, `setTrackingSpeed`, `setZoomOffset`이 있습니다. `setStops`는 사진 또는 날짜 marker stop 추가·제거·길이 변경 시 현재 경로 진행 위치를 보존하고, 같은 stop의 길이만 바뀌면 해당 stop 내부의 진행 비율도 보존합니다. **사용자 `zoomOffset`은 계획 프레임의 `zoom/lockedZoom`에 미리 합산하지 않고 `PlaybackPlan.zoomOffset`에는 현재 설정값만 메타데이터로 보관합니다.** `PlayerController.setZoomOffset()`은 선택된 기본/locked/항공 안정 줌 뒤에 현재 사용자 offset을 최종 카메라 조정으로 정확히 한 번 적용하고 변경 즉시 현재 프레임을 다시 그립니다. `DurationLimits`는 `minSeconds/recommendedSeconds/maxSeconds` 외에 계산 근거인 `days`, `activeDays`, `distanceKm`, `extentKm`, `movementCount`를 보관합니다."
            ),
            (
              "- **지도 확대 slider의 범위는 `-1.5~+1.5`, 기본값은 정확한 중앙인 `0`**이다. 확대값은 계획 생성 시 `camera-modes.js`에 반영되며, 이미 계획이 만들어진 뒤 slider를 바꿔도 `PlayerController.setZoomOffset()`이 `현재 설정 - plan.zoomOffset` 차이만 즉시 적용한다. 따라서 짧은 재생 길이에서도 `경로 다시 만들기`를 누르거나 느린 smoothing을 기다리지 않고 현재 카메라에 확대 변화가 바로 나타난다. live 변경 시 최종 zoom smoother와 tile zoom hysteresis 상태를 초기화하고 현재 프레임을 즉시 다시 그리며, 약 1.4초 앞 타일 warmup에도 같은 live offset을 사용한다. FLIGHT는 기존 안정 줌 계약을 유지하기 위해 사용자 추가 확대의 live delta를 적용하지 않는다. 사진 여정에서는 이 사용자 확대 위에 미디어 표시 여부와 무관하게 **기본 추가 확대 `PHOTO_JOURNEY_BASE_ZOOM_BOOST = 0.62`**를 적용한다. 비행기 이외 이동에서는 짧은 구간일수록 `1.08 * exp(-distanceKm / 20)` 형태의 추가 확대를 더해, 구간 경계에서 계단식으로 바뀌지 않고 거리에 따라 연속적으로 감소시킨다. 항공 구간은 이 사진 여정 추가 확대를 적용하지 않는다.",
              "- **지도 확대 slider의 범위는 `-1.5~+1.5`, 기본값은 정확한 중앙인 `0`**이다. 사용자 확대는 계획 생성 시 `camera-modes.js`의 `zoom/lockedZoom` 궤적에 미리 섞지 않는다. planner는 중립 카메라 궤적을 만들고 선택한 값은 `plan.zoomOffset` 메타데이터로만 보관하며, `PlayerController`가 기본 줌 또는 `lockedZoom`, 항공 구간의 안정 줌을 먼저 선택한 다음 현재 사용자 offset을 **최종 카메라에 정확히 한 번** 더한다. 이 최종 offset은 일반 TRAVEL, `현재 위치 따라가기`의 locked zoom, FLIGHT, OUTRO/전체 경로 화면에 모두 적용한다. 따라서 짧은 재생에서 OUTRO 비중이 커도 확대가 사라지지 않고, `경로 다시 만들기` 전후에도 계획값과 live delta가 상쇄되거나 중복되지 않는다. slider 변경 시 final zoom smoother와 tile zoom hysteresis 상태를 초기화하고 현재 프레임을 즉시 다시 그리며 약 1.4초 앞 타일 warmup에도 같은 최종 확대를 사용한다. FLIGHT의 장면 내 안정 줌은 유지하되 그 안정된 기준값 전체에 사용자 offset을 일정하게 더한다. 사진 여정에서는 이 사용자 확대 위에 비행기 이외 이동에만 **기본 추가 확대 `PHOTO_JOURNEY_BASE_ZOOM_BOOST = 0.62`**와 `1.08 * exp(-distanceKm / 20)` 거리 기반 확대를 추가하며, 사진 전용 확대는 FLIGHT에 적용하지 않는다."
            ),
            (
              "- `PlayerController`: 프레임 보간, 항공 안정 줌, stop 스케줄 재매핑과 재생 시간 기준을 검토했다. `현재 위치 따라가기`가 켜진 TRAVEL frame은 계획용 `lockedCenter`가 실제 위치에서 벗어나 있어도 보간된 `frame.position`을 지도 중심으로 사용하고, `lockedZoom`은 필요 시 화면 범위 계산에 유지한다. 사진 여정의 기본 거리 줌은 `0.62 + 1.08 * exp(-distanceKm / 20)` 계열의 연속 곡선을 사용하고 FLIGHT는 제외한다. 실제 사진 stop 동안에는 작은 추가 줌을 단조 증가/유지시키고, stop 종료 뒤 별도 slow-release 상태로 천천히 감쇠시켜 인접 사진 사이의 `줌인 → 줌아웃 → 줌인` 왕복을 억제한다. 사진 stop에서 route time이 멈춰도 카메라 추종 시간은 `this.timeSec`을 사용하므로 사진 표시 중에도 줌이 계속 움직인다. 마지막에는 기존 smooth zoom을 통과해 방향 반전 hysteresis, 속도/가속도 제한, overshoot 방지 계약을 유지한다. 최종 줌은 정수 타일 줌 경계에서 약 ±0.07 hysteresis를 추가로 적용하고, 재생 중에는 약 1.4초 앞의 카메라를 계산해 타일 warmup에 전달한다. 사용자 지도 확대가 바뀌면 계획에 이미 포함된 offset을 뺀 delta만 즉시 더하고 final zoom/tile boundary 상태를 초기화해 짧은 재생에서도 즉시 반영하며, FLIGHT에는 이 live delta를 적용하지 않는다.",
              "- `PlayerController`: 프레임 보간, 항공 안정 줌, stop 스케줄 재매핑과 재생 시간 기준을 검토했다. `현재 위치 따라가기`가 켜진 TRAVEL frame은 계획용 `lockedCenter`가 실제 위치에서 벗어나 있어도 보간된 `frame.position`을 지도 중심으로 사용하고, `lockedZoom`은 필요 시 화면 범위 계산에 유지한다. 사용자 지도 확대는 계획 프레임에 내장하지 않고 PlayerController가 최종 줌에 한 번만 적용한다. 일반 TRAVEL과 locked zoom뿐 아니라 **안정화된 FLIGHT zoom과 OUTRO에도 동일한 offset을 적용**하므로 짧은 재생이나 재계획 후에도 설정이 사라지지 않는다. FLIGHT는 scene 내부의 기준 줌을 먼저 안정화한 뒤 일정한 사용자 offset을 더해 장면 안정성은 유지한다. 사진 여정의 기본 거리 줌은 `0.62 + 1.08 * exp(-distanceKm / 20)` 계열의 연속 곡선을 사용하고 사진 전용 boost는 FLIGHT에서 제외한다. 실제 사진 stop 동안에는 작은 추가 줌을 단조 증가/유지시키고, stop 종료 뒤 별도 slow-release 상태로 천천히 감쇠시켜 인접 사진 사이의 `줌인 → 줌아웃 → 줌인` 왕복을 억제한다. 사진 stop에서 route time이 멈춰도 카메라 추종 시간은 `this.timeSec`을 사용하므로 사진 표시 중에도 줌이 계속 움직인다. 마지막에는 기존 smooth zoom을 통과해 방향 반전 hysteresis, 속도/가속도 제한, overshoot 방지 계약을 유지한다. 최종 줌은 정수 타일 줌 경계에서 약 ±0.07 hysteresis를 추가로 적용하고, 재생 중에는 약 1.4초 앞의 카메라를 계산해 타일 warmup에 전달한다."
            ),
            (
              "- `camera-modes`/camera planner: 이동수단별 목표 view span과 AUTO/DAY/SEGMENT 의미는 유지하되, 최종 zoom trajectory에 긴 zoom-out preview, 비대칭 smoothing, 속도/가속도 제한과 방향 반전 hysteresis를 적용한다. 전체 테스트 중 kinematic limiter가 목표를 지나친 뒤 되돌아오며 미세한 줌 왕복을 만드는 실제 결함을 발견해, 현재 목표를 overshoot하지 않도록 수정했다. 재생 길이는 선택 기간, 지리적 extent, 총 이동 거리, 활동일 수, movement 수의 조합으로 최소·추천·최대를 계산하지만 **자동 기본 길이는 최소·최대의 5초 step 중앙값**을 사용한다.",
              "- `camera-modes`/camera planner: 이동수단별 목표 view span과 AUTO/DAY/SEGMENT 의미는 유지하되, 최종 zoom trajectory에 긴 zoom-out preview, 비대칭 smoothing, 속도/가속도 제한과 방향 반전 hysteresis를 적용한다. 전체 테스트 중 kinematic limiter가 목표를 지나친 뒤 되돌아오며 미세한 줌 왕복을 만드는 실제 결함을 발견해, 현재 목표를 overshoot하지 않도록 수정했다. **사용자 지도 확대는 이 계획 궤적 계산에서 0으로 두어 중립 궤적을 만들고 `plan.zoomOffset`에는 설정값만 기록하며, 실제 화면 확대는 PlayerController가 최종 단계에서 소유한다.** 재생 길이는 선택 기간, 지리적 extent, 총 이동 거리, 활동일 수, movement 수의 조합으로 최소·추천·최대를 계산하지만 **자동 기본 길이는 최소·최대의 5초 step 중앙값**을 사용한다."
            ),
            (
              "- **2026-09-03 중앙값 기본값/실시간 지도 확대 수정에서는 사용자 요청에 따라 전체 `npm run verify`, production build, Playwright를 실행하지 않았다.** 대신 임시 브랜치 기본 체크에서 `npm run typecheck`와 직접 관련된 `src/domain/planner.test.ts`, `src/player/player-controller.test.ts`, `src/App.test.tsx`만 실행했고 **3개 test file / 20개 테스트가 모두 통과**했다. 첫 체크에서 App 테스트의 접근성 이름 가정 1건이 실패했으나 제품 값은 이미 `0`으로 렌더링되고 있었고, 테스트 조회 방식을 실제 DOM 구조에 맞게 고친 뒤 동일 범위 재실행에서 전부 통과했다. 임시 체크 workflow는 검증 후 저장소에서 제거했다.",
              "- **2026-09-03 중앙값 기본값/지도 확대 수정에서는 사용자 요청에 따라 전체 `npm run verify`, production build, Playwright를 실행하지 않았다.** 중앙값 기본값 수정 당시 관련 기본 체크는 3개 test file / 20개 테스트가 통과했다. 이후 실제 사용에서 확대가 TRAVEL에만 적용되고 OUTRO와 FLIGHT에는 적용되지 않아 짧은 재생·재계획에서 확대가 사라져 보이는 결함을 확인했다. 최종 수정은 사용자 확대의 소유권을 PlayerController 최종 카메라 단계 하나로 통합하고, `src/domain/planner.test.ts`, `src/player/player-controller.test.ts`, `src/App.test.tsx`에 재계획·locked/current-position·FLIGHT·OUTRO의 실제 `map.jumpTo()` 확대를 검증하는 테스트를 추가했다. 임시 브랜치 기본 체크에서 **`npm run typecheck` 성공 + 3개 test file / 23개 테스트 전부 통과**했고, 전체 verify/build/Playwright는 실행하지 않았다. 임시 체크 workflow는 검증 후 저장소에서 제거했다."
            )
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'expected context paragraph not found: {old[:80]}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AI_PROJECT_CONTEXT.md
          git commit -m "Document final map zoom ownership [skip ci]"
          git push origin HEAD:ai/fix-map-zoom-application
