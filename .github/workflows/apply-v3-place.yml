name: temporary-apply-v3-place

on:
  push:
    branches: [ai/v3-finalize-use]

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.v3-place-patch-01 scripts/.v3-place-patch-02 | base64 -d | gzip -d > /tmp/v3-place.patch
          echo 'de8575edb077927624b11d413eaa8fa2a0301ef97de47bb7706bd915372e1968  /tmp/v3-place.patch' | sha256sum -c -
          git apply --check /tmp/v3-place.patch
          git apply /tmp/v3-place.patch
          git diff --check
          node --check server.mjs
      - run: npm ci
      - name: Focused type, lint and unit checks
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx eslint \
            server.mjs \
            src/App.tsx src/App.test.tsx \
            src/types.ts src/settings/preferences.ts \
            src/map/city-label.ts src/map/city-label.test.ts \
            src/map/photo-place-label.ts src/map/photo-place-label.test.ts \
            src/map/map-style-local.ts \
            src/media/MediaJourneyPane.test.tsx \
            src/media/local-media-library.ts \
            src/media/media-analysis.ts src/media/media-analysis.test.ts \
            src/media/media-library.ts src/media/media-library.test.ts \
            src/media/media-metadata.ts \
            src/media/photo-place-resolver.ts src/media/photo-place-resolver.test.ts \
            src/ui/HelpDialog.tsx src/ui/MediaLibraryDialog.tsx
          npx vitest run \
            src/App.test.tsx \
            src/domain/v3-boundaries.test.ts \
            src/map/city-label.test.ts \
            src/map/photo-place-label.test.ts \
            src/media/MediaJourneyPane.test.tsx \
            src/media/media-analysis.test.ts \
            src/media/media-library.test.ts \
            src/media/photo-place-resolver.test.ts
      - name: Verify place and glyph server caches without external services
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fake-provider.mjs <<'NODE'
          import { createServer } from 'node:http';
          const server = createServer((request, response) => {
            const url = new URL(request.url || '/', 'http://127.0.0.1:5530');
            if (url.pathname.startsWith('/fonts/')) {
              const body = Buffer.from([1, 2, 3, 4, 5, 6]);
              response.writeHead(200, { 'Content-Type': 'application/x-protobuf', 'Content-Length': body.length });
              response.end(body);
              return;
            }
            if (url.pathname === '/reverse') {
              const body = JSON.stringify({
                lat: url.searchParams.get('lat') || '37.5',
                lon: url.searchParams.get('lon') || '127',
                category: 'tourism',
                type: 'attraction',
                name: 'Test Place',
                namedetails: { 'name:ko': '테스트 장소', 'name:en': 'Test Place' },
                address: { city: '서울' }
              });
              response.writeHead(200, { 'Content-Type': 'application/json; charset=utf-8', 'Content-Length': Buffer.byteLength(body) });
              response.end(body);
              return;
            }
            response.writeHead(404).end();
          });
          server.listen(5530, '127.0.0.1');
          NODE
          node /tmp/fake-provider.mjs > /tmp/fake-provider.log 2>&1 &
          provider_pid=$!
          TRAVEL_PLACE_REVERSE_URL='http://127.0.0.1:5530/reverse' \
          TRAVEL_PLACE_PROVIDER_LABEL='테스트 장소 서비스' \
          TRAVEL_PLACE_MIN_INTERVAL_MS=0 \
          TRAVEL_GLYPH_BASE_URL='http://127.0.0.1:5530/fonts/' \
          node server.mjs --no-local-data --port 5529 > /tmp/travel-server.log 2>&1 &
          app_pid=$!
          cleanup() { kill "$app_pid" "$provider_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5529/api/photo-place-status > /tmp/status.json; then break; fi
            sleep 0.25
          done
          node -e "const v=JSON.parse(require('fs').readFileSync('/tmp/status.json')); if(!v.available || v.provider!=='테스트 장소 서비스') process.exit(1)"
          curl -fsS -H 'Origin: http://127.0.0.1:5529' -H 'Content-Type: application/json' \
            -d '{"lat":37.5,"lng":127,"gpsAccuracyM":8}' \
            http://127.0.0.1:5529/api/photo-place > /tmp/place-first.json
          node -e "const v=JSON.parse(require('fs').readFileSync('/tmp/place-first.json')); if(!v.found || v.name!=='테스트 장소' || v.cached) process.exit(1)"
          curl -fsS 'http://127.0.0.1:5529/api/map-glyphs/Noto%20Sans/0-255.pbf' -o /tmp/glyph-first.pbf
          kill "$provider_pid"
          wait "$provider_pid" 2>/dev/null || true
          provider_pid=''
          curl -fsS -H 'Origin: http://127.0.0.1:5529' -H 'Content-Type: application/json' \
            -d '{"lat":37.5,"lng":127,"gpsAccuracyM":8}' \
            http://127.0.0.1:5529/api/photo-place > /tmp/place-cached.json
          node -e "const v=JSON.parse(require('fs').readFileSync('/tmp/place-cached.json')); if(!v.found || !v.cached || v.name!=='테스트 장소') process.exit(1)"
          curl -fsS 'http://127.0.0.1:5529/api/map-glyphs/Noto%20Sans/0-255.pbf' -o /tmp/glyph-cached.pbf
          cmp /tmp/glyph-first.pbf /tmp/glyph-cached.pbf
          test -s .cache/photo-places.json
          find .cache/map-glyphs -type f -name '0-255.pbf' -size +0c | grep -q .
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true
          app_pid=''
          trap - EXIT
      - name: Recheck desktop and mobile UI
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test e2e/ui-audit.spec.ts --project=desktop --project=mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit-after-place-improvements
          path: ui-audit
          if-no-files-found: ignore
      - name: Remove temporary audit machinery and commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.v3-place-patch-01 scripts/.v3-place-patch-02
          rm -f e2e/ui-audit.spec.ts
          rm -f .github/workflows/source-snapshot.yml .github/workflows/ui-audit.yml .github/workflows/apply-v3-place.yml
          git diff --check
          git status --short
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'Improve photo place resolution and local map caching [skip ci]'
          git push origin HEAD:ai/v3-finalize-use
