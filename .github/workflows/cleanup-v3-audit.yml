name: temporary-clean-v3-audit

on:
  push:
    branches: [ai/v3-finalize-use]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove audit artifacts and this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ui-audit
          rm -f .github/workflows/cleanup-v3-audit.yml
          git diff --check
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'Remove temporary v3 UI audit artifacts [skip ci]'
          git push origin HEAD:ai/v3-finalize-use
