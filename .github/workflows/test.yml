name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check server.mjs
          for file in scripts/*.mjs src/*.js tests/*.js; do
            node --check "$file"
          done
      - name: Bundled Timeline startup check
        shell: bash
        run: |
          set -euo pipefail
          node server.mjs > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://localhost:5173/data/timeline-bundle.js -o timeline-bundle.js; then
              break
            fi
            sleep 0.25
          done
          test -s timeline-bundle.js
          grep -q 'BUNDLED_TIMELINE' timeline-bundle.js
          curl --fail --silent http://localhost:5173/api/map-status | grep -q '"ready"'
          curl --fail --silent http://localhost:5173/ | grep -q 'Travel Camera Visualizer'
          cat server.log
      - name: Unit tests
        run: npm test
