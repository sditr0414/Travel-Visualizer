name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify source and build
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verification.log
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          set -o pipefail
          npm run test:e2e -- --workers=1 2>&1 | tee browser-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-evidence
          retention-days: 3
          path: |
            verification.log
            browser-verification.log
            playwright-report/
            test-results/
