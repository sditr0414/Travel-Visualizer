name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check scripts/setup-local-map.mjs
          node --check src/local-map.js
          node --check src/main.js
          node --check src/route-player.js
      - name: Unit tests
        run: npm test
