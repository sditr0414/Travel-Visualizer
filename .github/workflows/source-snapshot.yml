name: temporary-source-snapshot

on:
  push:
    branches: [ai/v3-ui-place-audit]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            src
            e2e
            scripts
            .github/workflows
            server.mjs
            package.json
            package-lock.json
            playwright.config.ts
            tsconfig*.json
            vite.config.*
            eslint.config.*
            *.css
            *.md
            *.html
            *.cmd
