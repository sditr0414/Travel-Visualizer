name: temporary-v2-palette-local-data-retry

on:
  push:
    branches: [ai/v3-v2-palette-local-test-data]

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply product changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'unexpected count in {path}: {actual}, expected {count}')
              p.write_text(text.replace(old, new))

          replace('src/styles.css', '  --media-surface: #272b2f;', '  --media-surface: #181b1e;', 1)
          replace('src/settings-polish.css', '  color: #e8e3dc;', '  color: #d2ccc5;', 1)
          replace('src/settings-polish.css', '  background: #202428;', '  background: #23272b;', 1)

          p = Path('src/usability-fixes.css')
          text = p.read_text()
          for old, new in {
              'color: #c6c3be;': 'color: var(--muted);',
              'color: #ccc8c2;': 'color: #d8d4ce;',
              'color: #ffbb93;': 'color: var(--accent);',
              'color: #bdbbb5;': 'color: var(--muted);',
              'border: 1px solid #555a60;': 'border: 1px solid var(--line);',
              'background: #20262d;': 'background: var(--surface-raised);',
              'color: #f6f1e9;': 'color: var(--paper);',
              'color: #d8d4cd;': 'color: var(--muted);',
              'background: #20262ddd;': 'background: var(--surface-raised);'
          }.items():
              if old not in text:
                  raise SystemExit(f'missing usability token: {old}')
              text = text.replace(old, new)
          p.write_text(text)

          p = Path('src/ux-polish.css')
          text = p.read_text()
          for old, new in {
              'color: #ece7e0;': 'color: var(--paper);',
              'color: #c7c1ba;': 'color: var(--muted);',
              'color: #e6e1da;': 'color: #d8d4ce;'
          }.items():
              if old not in text:
                  raise SystemExit(f'missing ux token: {old}')
              text = text.replace(old, new)
          p.write_text(text)

          replace(
              'server.mjs',
              "const localTimeline = configuredPath('TRAVEL_TIMELINE_PATH', resolve(root, '..', '타임라인.json'));\nconst localMediaRoot = configuredPath('TRAVEL_MEDIA_DIR', resolve(root, '..', '여행 사진'));",
              "const localTimeline = configuredPreferredPath('TRAVEL_TIMELINE_PATH', [join(root, '타임라인.json'), resolve(root, '..', '타임라인.json')], 'file');\nconst localMediaRoot = configuredPreferredPath('TRAVEL_MEDIA_DIR', [join(root, '여행 사진'), resolve(root, '..', '여행 사진')], 'directory');",
              1
          )
          replace(
              'server.mjs',
              "function configuredPath(environmentName, fallback) {\n  const value = process.env[environmentName]?.trim();\n  return value ? resolve(value) : fallback;\n}\n",
              "function configuredPath(environmentName, fallback) {\n  const value = process.env[environmentName]?.trim();\n  return value ? resolve(value) : fallback;\n}\n\nfunction configuredPreferredPath(environmentName, candidates, kind) {\n  const value = process.env[environmentName]?.trim();\n  if (value) return resolve(value);\n  for (const candidate of candidates) {\n    try {\n      const stats = statSync(candidate);\n      if ((kind === 'file' && stats.isFile()) || (kind === 'directory' && stats.isDirectory())) return candidate;\n    } catch {\n      // Missing candidates are expected; try the next v2-compatible location.\n    }\n  }\n  return candidates[0];\n}\n",
              1
          )

          p = Path('.gitignore')
          text = p.read_text()
          if '/여행 사진/' not in text:
              text = text.replace('/타임라인.json\n', '/타임라인.json\n/여행 사진/\n')
          p.write_text(text)

          p = Path('README.md')
          text = p.read_text()
          text = text.replace('| Timeline | 저장소 상위 폴더의 `타임라인.json` |', '| Timeline | 앱/저장소 폴더의 `타임라인.json` 우선, 없으면 상위 폴더 |')
          text = text.replace('| 사진·영상 | 저장소 상위 폴더의 `여행 사진` |', '| 사진·영상 | 앱/저장소 폴더의 `여행 사진` 우선, 없으면 상위 폴더 |')
          marker = '기본 파일이 없어도 파일 선택기로 사용할 수 있습니다. 경로는 `TRAVEL_TIMELINE_PATH`, `TRAVEL_MEDIA_DIR`, `TRAVEL_METADATA_CACHE`, `TRAVEL_PLACE_CACHE`, `TRAVEL_GLYPH_CACHE_DIR` 환경변수로 변경할 수 있습니다.\n'
          addition = marker + '\n개발·테스트할 때는 v2처럼 저장소 루트에 `타임라인.json`과 `여행 사진/`을 두고 실행하면 별도 선택 없이 자동으로 불러옵니다. 두 경로는 Git에서 제외되며, 루트에 없을 때만 기존 상위 폴더 위치를 확인합니다.\n'
          if marker not in text:
              raise SystemExit('README marker missing')
          p.write_text(text.replace(marker, addition, 1))

          p = Path('AI_PROJECT_CONTEXT.md')
          text = p.read_text()
          old = '- 사용자가 v2 디자인 계승을 명시했습니다. 전체 화면 지도, 반투명 topbar/HUD/player, 접히는 details 설정 패널, 기존 색상·간격을 유지합니다. 전면 재설계하지 않습니다.\n'
          new = '- 사용자가 v2 디자인 계승을 명시했습니다. 전체 화면 지도, 반투명 topbar/HUD/player, 접히는 details 설정 패널, 기존 색상·간격을 유지합니다. 색상 기준도 v2 토큰(`--ink #171a1d`, `--surface rgba(24,27,30,.92)`, `--paper #f7f3ed`, `--muted #aaa7a2`, `--accent #ff725d`)을 따르며 새 UI가 별도 청회색 팔레트를 만들지 않습니다. 전면 재설계하지 않습니다.\n'
          if old not in text:
              raise SystemExit('context palette marker missing')
          text = text.replace(old, new, 1)
          old = '로컬 데이터 기본 경로·환경변수는 README를 따릅니다. stream 오류·클라이언트 연결 종료를 처리합니다. 개인 데이터·캐시·지도는 커밋하지 않습니다.\n'
          new = '로컬 데이터 기본 경로·환경변수는 README를 따릅니다. v2처럼 저장소 루트의 `타임라인.json` / `여행 사진/`을 먼저 확인하고 없으면 상위 폴더를 확인하며, 환경변수 지정은 항상 이 자동 탐색보다 우선합니다. stream 오류·클라이언트 연결 종료를 처리합니다. 개인 데이터·캐시·지도는 커밋하지 않습니다.\n'
          if old not in text:
              raise SystemExit('context local marker missing')
          p.write_text(text.replace(old, new, 1))

          p = Path('AI_START_HERE.md')
          text = p.read_text()
          old = '- 기존 경로·카메라 엔진을 유지합니다. 제품 UI는 v2의 색상·배치·반투명 패널을 계승합니다. 전면 재설계를 반복하지 않습니다. 도움말/사진 목록만 공통 Dialog를 사용합니다.\n'
          new = '- 기존 경로·카메라 엔진을 유지합니다. 제품 UI는 v2의 색상·배치·반투명 패널을 계승하며 새 UI도 v2 팔레트 토큰을 사용합니다. 전면 재설계를 반복하지 않습니다. 도움말/사진 목록만 공통 Dialog를 사용합니다.\n'
          if old not in text:
              raise SystemExit('start marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          node --check server.mjs
      - run: npm ci
      - name: Focused checks and local-data lookup
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx eslint server.mjs src/App.tsx src/App.test.tsx
          npx vitest run src/App.test.tsx
          cleanup() {
            kill "${app_pid:-}" 2>/dev/null || true
            rm -f '타임라인.json' ../타임라인.json
            rm -rf '여행 사진'
          }
          trap cleanup EXIT
          printf '{"semanticSegments":[]}' > '타임라인.json'
          mkdir -p '여행 사진'
          printf 'png' > '여행 사진/test.png'
          node server.mjs --port 5524 >/tmp/root-local-data.log 2>&1 & app_pid=$!
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:5524/api/local-timeline >/tmp/root.json && break || sleep 0.25; done
          grep -q semanticSegments /tmp/root.json
          curl -fsS http://127.0.0.1:5524/api/local-media-manifest >/tmp/media.json
          node -e "const v=JSON.parse(require('fs').readFileSync('/tmp/media.json')); if(!v.available || v.count!==1) process.exit(1)"
          kill "$app_pid"; wait "$app_pid" 2>/dev/null || true; app_pid=''
          rm -f '타임라인.json'; rm -rf '여행 사진'
          printf '{"semanticSegments":[{"fallback":true}]}' > ../타임라인.json
          node server.mjs --port 5524 >/tmp/parent-local-data.log 2>&1 & app_pid=$!
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:5524/api/local-timeline >/tmp/parent.json && break || sleep 0.25; done
          grep -q fallback /tmp/parent.json
          kill "$app_pid"; wait "$app_pid" 2>/dev/null || true; app_pid=''
          rm -f ../타임라인.json
          trap - EXIT
      - name: Desktop and mobile palette audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p palette-audit
          cat > e2e/palette-audit.spec.ts <<'TS'
          import { expect, test } from '@playwright/test';
          import { attachLocalPhotoManifest, loadLocalTimeline } from './helpers';

          test('v2 palette remains the v3 visual baseline', async ({ page }, testInfo) => {
            await attachLocalPhotoManifest(page);
            await page.goto('/');
            const tokens = await page.evaluate(() => {
              const style = getComputedStyle(document.documentElement);
              return {
                ink: style.getPropertyValue('--ink').trim(),
                surface: style.getPropertyValue('--surface').trim(),
                paper: style.getPropertyValue('--paper').trim(),
                muted: style.getPropertyValue('--muted').trim(),
                accent: style.getPropertyValue('--accent').trim(),
                media: style.getPropertyValue('--media-surface').trim()
              };
            });
            expect(tokens.ink).toBe('#171a1d');
            expect(['rgba(24, 27, 30, 0.92)', '#181b1eeb']).toContain(tokens.surface);
            expect(tokens.paper).toBe('#f7f3ed');
            expect(tokens.muted).toBe('#aaa7a2');
            expect(tokens.accent).toBe('#ff725d');
            expect(tokens.media).toBe('#181b1e');
            await page.screenshot({ path: `palette-audit/${testInfo.project.name}-start.png`, fullPage: true });
            await loadLocalTimeline(page);
            await page.getByRole('button', { name: '사진 여정' }).click();
            await expect(page.locator('.media-journey-pane')).toBeVisible();
            expect(await page.locator('.media-journey-pane').evaluate(el => getComputedStyle(el).backgroundColor)).toBe('rgb(24, 27, 30)');
            await page.getByText('여행 설정').click();
            await expect(page.locator('.settings-content')).toBeVisible();
            await page.screenshot({ path: `palette-audit/${testInfo.project.name}-photo-settings.png`, fullPage: true });
          });
          TS
          npx playwright install --with-deps chromium
          npx playwright test e2e/palette-audit.spec.ts --project=desktop --project=mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-palette-ui-audit
          path: palette-audit
          if-no-files-found: error
      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f e2e/palette-audit.spec.ts
          rm -rf palette-audit
          rm -f .github/workflows/temporary-v2-palette-local-data.yml .github/workflows/temporary-v2-palette-local-data-retry.yml
          rm -f '타임라인.json' ../타임라인.json
          rm -rf '여행 사진'
          git diff --check
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'Restore v2 palette and local test data loading [skip ci]'
          git push origin HEAD:ai/v3-v2-palette-local-test-data
