name: photo-detail-zoom-check

on:
  push:
    branches:
      - ai/photo-detail-zoom
    paths:
      - .github/workflows/photo-detail-zoom-check.yml

permissions:
  contents: write

jobs:
  focused-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/apply-photo-detail-zoom.py
      - run: git diff --check
      - run: npm run typecheck
      - run: npx eslint src/player/player-controller.ts src/player/player-controller.test.ts src/App.tsx src/App.test.tsx --max-warnings=0
      - run: npx vitest run src/player/player-controller.test.ts src/App.test.tsx
      - name: Commit focused changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/player/player-controller.ts src/player/player-controller.test.ts src/App.tsx src/App.test.tsx AI_PROJECT_CONTEXT.md
          git commit -m "Add adjustable photo journey detail zoom [skip ci]"
          git push
