name: temporary-trip-candidates

on:
  push:
    branches:
      - ai/help-tooltip-recommended-range

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/temporary-apply-help-range.mjs
      - name: Focused checks
        run: |
          npm run typecheck
          npx eslint src/App.tsx src/App.test.tsx src/domain/timeline.ts src/domain/timeline.test.ts src/types.ts src/ui/SettingHelp.tsx src/ui/SettingHelp.test.tsx
          npx vitest run src/domain/timeline.test.ts src/ui/SettingHelp.test.tsx src/App.test.tsx
      - name: Commit validated changes
        run: |
          rm -f scripts/temporary-apply-help-range.mjs .github/workflows/temporary-trip-candidates.yml
          git diff --check
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'Improve help hover and add selectable trip recommendations [skip ci]'
          git push origin HEAD:ai/help-tooltip-recommended-range
