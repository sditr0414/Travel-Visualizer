name: final-video-fix
on:
  push:
    branches: [qa/final-video-fix-20260915]
    paths: [.github/workflows/final-video-fix.yml]
permissions:
  contents: read
jobs:
  video-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded copy and test-fixture corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()
          old = '첫 화면만 표시은 영상의 첫 화면을 보여줍니다.'
          assert text.count(old) == 2
          text = text.replace(old, '첫 화면만 표시를 선택하면 영상의 첫 화면만 보여줍니다.')
          old = '대표 사진만은 비슷한 시간·장소에서 고른 사진을, 모든 사진은 연결된 사진을 모두 보여줍니다.'
          assert text.count(old) == 2
          text = text.replace(old, '대표 사진만: 비슷한 시간·장소에서 고른 사진을 보여줍니다. 모든 사진: 연결된 사진을 모두 보여줍니다.')
          p.write_text(text)
          p = Path('e2e/audit-regressions.spec.ts')
          text = p.read_text()
          text = text.replace("import { attachLocalPhotoManifest, loadLocalTimeline } from './helpers';", "import { attachLocalPhotoManifest, loadLocalTimeline } from './helpers';\n\ntest.use({ timezoneId: 'Asia/Seoul' });")
          old = "  await page.locator('.settings-panel summary').click();\n  const play = page.getByRole('button', { name: '재생', exact: true });"
          assert text.count(old) == 1
          text = text.replace(old, "  // File selection closes settings by design; do not click the summary again.\n  await expect(page.locator('.settings-panel')).not.toHaveAttribute('open', '');\n  const play = page.getByRole('button', { name: '재생', exact: true });")
          old = '  await page.waitForTimeout(1800);'
          assert text.count(old) == 1
          text = text.replace(old, "  await expect.poll(async () => Number(await page.getByLabel('재생 위치', { exact: true }).inputValue()), { timeout: 10000 }).toBeGreaterThan(2);\n  await expect.poll(() => video.evaluate(node => {\n    const element = node as HTMLVideoElement;\n    return element.paused || element.ended;\n  })).toBe(true);")
          p.write_text(text)
          PY
          git diff --check
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git rm .github/workflows/final-video-fix.yml
          git add src/App.tsx e2e/audit-regressions.spec.ts
          git commit -m "Correct video import sequencing, fixture timezone and settings copy"
          git push origin HEAD:fix/photo-journey-audit
          git push origin HEAD:qa/final-video-fix-20260915
          echo "VERIFIED_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - run: npm ci
      - name: Verify code and production build
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verification.log
      - run: npx playwright install --with-deps chromium
      - name: Decoded video regressions on desktop and mobile
        run: |
          set -o pipefail
          npm run test:e2e -- e2e/audit-regressions.spec.ts --grep 'real decoded short video' --workers=1 2>&1 | tee browser-verification.log
      - name: Show synthetic failure contexts
        if: failure()
        run: find test-results -name error-context.md -type f -print -exec cat {} \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-video-regression-evidence
          retention-days: 3
          path: |
            verification.log
            browser-verification.log
            playwright-report/
            test-results/
