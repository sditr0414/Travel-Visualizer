name: temporary-v2-palette-final

on:
  push:
    branches: [ai/v3-v2-palette-local-test-data]

permissions:
  contents: write

jobs:
  validate-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Reuse verified product-change script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-v2-palette-local-data-retry.yml').read_text()
          marker = "          python - <<'PY'\n"
          block = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-product.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/apply-product.py
          git diff --check
          node --check server.mjs
      - run: npm ci
      - name: Focused checks and v2-style root test-data lookup
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx eslint server.mjs src/App.tsx src/App.test.tsx
          npx vitest run src/App.test.tsx
          cleanup() {
            kill "${app_pid:-}" 2>/dev/null || true
            rm -f '타임라인.json' ../타임라인.json
            rm -rf '여행 사진'
          }
          trap cleanup EXIT
          printf '{"semanticSegments":[]}' > '타임라인.json'
          mkdir -p '여행 사진'
          printf 'png' > '여행 사진/test.png'
          node server.mjs --port 5524 >/tmp/root-local-data.log 2>&1 & app_pid=$!
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:5524/api/local-timeline >/tmp/root.json && break || sleep 0.25; done
          grep -q semanticSegments /tmp/root.json
          curl -fsS http://127.0.0.1:5524/api/local-media-manifest >/tmp/media.json
          node -e "const v=JSON.parse(require('fs').readFileSync('/tmp/media.json')); if(!v.available || v.count!==1) process.exit(1)"
          kill "$app_pid"; wait "$app_pid" 2>/dev/null || true; app_pid=''
          rm -f '타임라인.json'; rm -rf '여행 사진'
          printf '{"semanticSegments":[{"fallback":true}]}' > ../타임라인.json
          node server.mjs --port 5524 >/tmp/parent-local-data.log 2>&1 & app_pid=$!
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:5524/api/local-timeline >/tmp/parent.json && break || sleep 0.25; done
          grep -q fallback /tmp/parent.json
          kill "$app_pid"; wait "$app_pid" 2>/dev/null || true; app_pid=''
          rm -f ../타임라인.json
          trap - EXIT
      - name: Desktop and mobile v2 palette audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p palette-audit
          cat > e2e/palette-audit.spec.ts <<'TS'
          import { expect, test } from '@playwright/test';
          import { attachLocalPhotoManifest, loadLocalTimeline } from './helpers';

          test('v2 palette remains the v3 visual baseline', async ({ page }, testInfo) => {
            await attachLocalPhotoManifest(page);
            await page.goto('/');
            const tokens = await page.evaluate(() => {
              const style = getComputedStyle(document.documentElement);
              return {
                ink: style.getPropertyValue('--ink').trim(),
                surface: style.getPropertyValue('--surface').trim(),
                paper: style.getPropertyValue('--paper').trim(),
                muted: style.getPropertyValue('--muted').trim(),
                accent: style.getPropertyValue('--accent').trim(),
                media: style.getPropertyValue('--media-surface').trim()
              };
            });
            expect(tokens.ink).toBe('#171a1d');
            expect(['rgba(24, 27, 30, 0.92)', '#181b1eeb']).toContain(tokens.surface);
            expect(tokens.paper).toBe('#f7f3ed');
            expect(tokens.muted).toBe('#aaa7a2');
            expect(tokens.accent).toBe('#ff725d');
            expect(tokens.media).toBe('#181b1e');
            await page.screenshot({ path: `palette-audit/${testInfo.project.name}-start.png`, fullPage: true });
            await loadLocalTimeline(page);
            await page.getByRole('button', { name: '사진 여정' }).click();
            await expect(page.locator('.media-journey-pane')).toBeVisible();
            expect(await page.locator('.media-journey-pane').evaluate(el => getComputedStyle(el).backgroundColor)).toBe('rgb(24, 27, 30)');
            await page.locator('.settings-panel summary').click();
            await expect(page.locator('.settings-content')).toBeVisible();
            await page.screenshot({ path: `palette-audit/${testInfo.project.name}-photo-settings.png`, fullPage: true });
          });
          TS
          npx playwright install --with-deps chromium
          npx playwright test e2e/palette-audit.spec.ts --project=desktop --project=mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-palette-final-audit
          path: palette-audit
          if-no-files-found: error
      - name: Commit validated product changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f e2e/palette-audit.spec.ts
          rm -rf palette-audit
          rm -f .github/workflows/temporary-v2-palette-local-data.yml
          rm -f .github/workflows/temporary-v2-palette-local-data-retry.yml
          rm -f .github/workflows/temporary-v2-palette-final.yml
          rm -f '타임라인.json' ../타임라인.json
          rm -rf '여행 사진'
          git diff --check
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'Restore v2 palette and local test data loading [skip ci]'
          git push origin HEAD:ai/v3-v2-palette-local-test-data
