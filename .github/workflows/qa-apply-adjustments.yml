name: qa-apply-adjustments
on:
  push:
    branches: [fix/checkbox-caption-zoom-continuity]
    paths: [.github/workflows/qa-apply-adjustments.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Apply hash-verified local changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'cae7fe738e482132fe5378e073e96cae5ef8a137f22b651478483aba54052598'
          Path('/tmp/adjustments.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '/tmp/adjustments.patch'], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '/tmp/adjustments.patch'], check=True)
          PY
      - name: Commit reviewed files and remove transfer workflow
        run: |
          rm .github/workflows/qa-apply-adjustments.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = '58b8c6b12db30e8934131db73060970b4fc41bae'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore transport text metrics, isolate checkbox clicks and remove integer zoom snaps'
          git push origin HEAD:refs/heads/fix/checkbox-caption-zoom-continuity
