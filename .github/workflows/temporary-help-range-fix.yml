    expect(screen.getByLabelText('여행 마지막 날')).toHaveValue('2026-04-11');
    fireEvent.click(screen.getByRole('button', { name: '전체 기간' }));
    expect(screen.getByLabelText('여행 시작')).toHaveValue('2026-03-01');
    fireEvent.click(screen.getByRole('button', { name: '추천 기간' }));
    expect(screen.getByLabelText('여행 시작')).toHaveValue('2026-04-04');
    expect(screen.getByLabelText('여행 마지막 날')).toHaveValue('2026-04-11');
  });
"""
          if marker not in text:
              raise SystemExit('App test marker missing')
          p.write_text(text.replace(marker, addition + marker, 1))
          PY

          git diff --check
      - name: Focused checks
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx eslint src/ui/SettingHelp.tsx src/ui/SettingHelp.test.tsx src/domain/timeline.ts src/domain/timeline.test.ts src/App.tsx src/App.test.tsx
          npx vitest run src/ui/SettingHelp.test.tsx src/domain/timeline.test.ts src/App.test.tsx
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-help-range-fix.yml
          git diff --check
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git commit -m 'Fix setting help hover and recommended trip range [skip ci]'
          git push origin HEAD:ai/help-tooltip-recommended-range
