<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Camera Visualizer</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>Travel Camera Visualizer</h1>
      <p>60fps · 거리/속도 기반 카메라 · 누락 경로 보간 · 전체 경로 엔딩</p>
    </div>
  </header>

  <main>
    <aside class="controls">
      <section>
        <h2>타임라인</h2>
        <label class="file-picker">Google Timeline JSON
          <input id="timelineFile" type="file" accept="application/json,.json" />
        </label>
        <div class="date-grid">
          <label>시작일<input id="startDate" type="date" value="2026-03-17" /></label>
          <label>종료일<input id="endDate" type="date" value="2026-03-31" /></label>
        </div>
        <label class="check"><input id="includeFlights" type="checkbox" checked /> 항공 구간 포함</label>
        <button id="loadButton" class="primary" disabled>경로 분석</button>
        <p id="status" class="status">지도를 불러오는 중…</p>
      </section>

      <section>
        <h2>영상</h2>
        <div class="setting-row"><span>프레임 레이트</span><strong>60 FPS</strong></div>
        <div class="setting-head">
          <span>전체 영상 길이</span>
          <output id="videoDurationLabel">분석 후 설정</output>
        </div>
        <input id="videoDuration" type="range" min="60" max="600" step="5" value="300" disabled aria-label="전체 영상 길이" />
        <p id="durationHint" class="hint">여행 거리와 날짜를 분석해 최소·권장·최대 시간을 계산합니다.</p>
      </section>

      <section>
        <h2>재생</h2>
        <div class="button-row">
          <button id="playButton" disabled>재생</button>
          <button id="resetButton" disabled>처음으로</button>
        </div>
        <label class="check"><input id="lockCameraToPosition" type="checkbox" checked /> 검증 모드: 현재 위치에 카메라 고정</label>
        <label class="check"><input id="showFullRoute" type="checkbox" /> 전체 경로 희미하게 표시</label>
        <input id="seek" type="range" min="0" max="1" step="0.0167" value="0" disabled aria-label="재생 위치" />
        <p class="hint">마지막 5~7초에는 자동으로 줌아웃하며 전체 경로를 보여줍니다.</p>
      </section>

      <section>
        <h2>현재 카메라</h2>
        <dl class="metrics">
          <div><dt>이동 성격</dt><dd id="currentMode">—</dd></div>
          <div><dt>추정 속도</dt><dd id="currentSpeed">—</dd></div>
          <div><dt>Zoom</dt><dd id="currentZoom">—</dd></div>
          <div><dt>여행 시각</dt><dd id="currentDate">—</dd></div>
        </dl>
      </section>
    </aside>

    <section class="stage" aria-label="여행 경로 지도">
      <div id="map"></div>
      <div id="summary" class="summary"></div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
