<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Camera Visualizer</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" />
  <link rel="preconnect" href="https://protomaps.github.io" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <h1>Travel Camera</h1>
      <span>여행 경로 영상 미리보기</span>
    </div>

    <div class="source-chip" aria-live="polite">
      <span class="source-dot"></span>
      <div>
        <small id="currentDataSourceType">내장 테스트 데이터</small>
        <strong id="currentDataSourceName">타임라인.json</strong>
      </div>
    </div>

    <label class="file-picker">
      <span>파일 변경</span>
      <input id="timelineFile" type="file" accept="application/json,.json" />
    </label>

    <p id="status" class="status">지도 소스를 확인하는 중…</p>
  </header>

  <main class="app-main">
    <section class="stage" aria-label="여행 경로 지도">
      <div id="map"></div>

      <div class="video-hud" aria-live="polite">
        <div id="videoDate" class="video-date" hidden>2026.03.17</div>
        <div class="movement-pill">
          <strong id="currentMode">—</strong>
          <span id="currentSpeed">—</span>
        </div>
      </div>

      <details class="settings-shell">
        <summary>영상 설정</summary>
        <div class="settings-card">
          <div class="setting-block">
            <label for="cameraMode">카메라</label>
            <select id="cameraMode">
              <option value="AUTO" selected>자동 · 권장</option>
              <option value="DAY">하루 지역 중심</option>
              <option value="SEGMENT">이동수단별</option>
            </select>
            <p id="cameraModeHint" class="hint"></p>
          </div>

          <div class="setting-block">
            <div class="setting-head">
              <label for="videoDuration">영상 길이</label>
              <output id="videoDurationLabel">분석 후 설정</output>
            </div>
            <input id="videoDuration" type="range" min="60" max="600" step="5" value="300" disabled aria-label="전체 영상 길이" />
            <p id="durationHint" class="hint">여행 거리와 날짜를 분석해 자동 계산합니다.</p>
          </div>

          <details class="advanced-settings">
            <summary>고급 설정</summary>
            <div class="advanced-grid">
              <div class="date-grid wide">
                <label>시작일<input id="startDate" type="date" value="2026-03-17" /></label>
                <label>종료일<input id="endDate" type="date" value="2026-03-31" /></label>
              </div>

              <label class="check"><input id="includeFlights" type="checkbox" checked /> 항공 포함</label>
              <label class="check"><input id="showFullRoute" type="checkbox" /> 전체 경로 표시</label>
              <label class="check wide"><input id="lockCameraToPosition" type="checkbox" checked /> 현재 위치에 카메라 고정</label>

              <div class="tracking-setting wide">
                <div class="setting-head">
                  <label for="cameraTrackingSpeed">추적 속도</label>
                  <output id="cameraTrackingSpeedLabel">1.0×</output>
                </div>
                <input id="cameraTrackingSpeed" type="range" min="0.5" max="2" step="0.1" value="1" disabled aria-label="카메라 추적 속도" />
              </div>

              <button id="loadButton" class="secondary wide" disabled>설정 적용 · 경로 다시 분석</button>
            </div>
          </details>

          <div class="route-legend" aria-label="이동수단별 경로 색상">
            <span><i class="legend-swatch walk"></i>도보</span>
            <span><i class="legend-swatch bike"></i>자전거</span>
            <span><i class="legend-swatch urban"></i>도시교통</span>
            <span><i class="legend-swatch rail"></i>철도</span>
            <span><i class="legend-swatch road"></i>도로</span>
            <span><i class="legend-swatch ferry"></i>페리</span>
            <span><i class="legend-swatch flight"></i>항공</span>
          </div>

          <div id="summary" class="summary"></div>
          <span id="currentZoom" class="visually-hidden">—</span>
          <span id="currentDate" class="visually-hidden">—</span>
        </div>
      </details>

      <div class="player-dock" aria-label="재생 컨트롤">
        <button id="playButton" class="play" disabled>재생</button>
        <button id="resetButton" class="icon-button" disabled aria-label="처음으로">처음</button>
        <input id="seek" type="range" min="0" max="1" step="0.0167" value="0" disabled aria-label="재생 위치" />
        <span class="fps-badge">60 FPS</span>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
