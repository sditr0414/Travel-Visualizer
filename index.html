<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Camera Visualizer</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>Travel Camera Visualizer</h1>
      <p>거리·속도·이동 성격을 분석하고 전체 카메라 궤적을 미리 스무딩합니다.</p>
    </div>
  </header>

  <main>
    <aside class="controls">
      <section>
        <h2>타임라인</h2>
        <label class="file-picker">Google Timeline JSON
          <input id="timelineFile" type="file" accept="application/json,.json" />
        </label>
        <div class="date-grid">
          <label>시작일<input id="startDate" type="date" value="2026-03-17" /></label>
          <label>종료일<input id="endDate" type="date" value="2026-03-31" /></label>
        </div>
        <label class="check"><input id="includeFlights" type="checkbox" checked /> 항공 구간 포함</label>
        <button id="loadButton" class="primary" disabled>경로 분석</button>
        <p id="status" class="status">지도를 불러오는 중…</p>
      </section>

      <section>
        <h2>재생</h2>
        <div class="button-row">
          <button id="playButton" disabled>재생</button>
          <button id="resetButton" disabled>처음으로</button>
        </div>
        <input id="seek" type="range" min="0" max="1" step="0.033" value="0" disabled aria-label="재생 위치" />
      </section>

      <section>
        <h2>현재 카메라</h2>
        <dl class="metrics">
          <div><dt>이동 성격</dt><dd id="currentMode">—</dd></div>
          <div><dt>추정 속도</dt><dd id="currentSpeed">—</dd></div>
          <div><dt>Zoom</dt><dd id="currentZoom">—</dd></div>
          <div><dt>여행 시각</dt><dd id="currentDate">—</dd></div>
        </dl>
      </section>
    </aside>

    <section class="stage" aria-label="여행 경로 지도">
      <div id="map"></div>
      <div id="summary" class="summary"></div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
